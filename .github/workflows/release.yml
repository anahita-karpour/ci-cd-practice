name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Make the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
